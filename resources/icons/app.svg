<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#3b82f6"/>
  
  <!-- Clipboard body -->
  <rect x="25" y="20" width="50" height="65" rx="5" fill="white"/>
  
  <!-- Clipboard clip -->
  <rect x="35" y="15" width="30" height="15" rx="3" fill="#e9edf2"/>
  <rect x="42" y="18" width="16" height="9" rx="2" fill="#3b82f6"/>
  
  <!-- Checkmark lines -->
  <line x1="32" y1="40" x2="45" y2="53" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <line x1="45" y1="53" x2="68" y2="30" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  
  <!-- List lines -->
  <line x1="32" y1="60" x2="68" y2="60" stroke="#d1d9e6" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="68" x2="58" y2="68" stroke="#d1d9e6" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="76" x2="62" y2="76" stroke="#d1d9e6" stroke-width="2" stroke-linecap="round"/>
</svg>
